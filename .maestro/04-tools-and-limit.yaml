# Practice tools work; 5 extra sessions a week are free, the 6th opens the paywall; the daily plan stays free.
appId: ${APP_ID}
---
- runFlow: subflows/fresh-user.yaml

# 1 — reading: text library + recorder
- tapOn:
    id: "tab-exercises"
- tapOn: "Plynulé čtení.*"
- tapOn: "Začít"
- repeat:
    times: 5
    commands:
      - tapOn: "Další →"
- tapOn: "Jdu na to →"
- assertVisible: "Nahraj se"
- tapOn: "Úroveň 3"
- tapOn: ".*Jiný text.*"
- takeScreenshot: 04-reading-practice
- tapOn: "Dokončit ✓"
- waitForAnimationToEnd
- tapOn: "Přeskočit"
- tapOn: "Hotovo →"

# 2 — metronome: start, change tempo, stop
- tapOn:
    id: "tab-exercises"
- tapOn: "Metronomická řeč.*"
- tapOn: "Začít"
- repeat:
    times: 4
    commands:
      - tapOn: "Další →"
- tapOn: "Jdu na to →"
- tapOn: "Spustit metronom.*"
- assertVisible: "Jedna slabika na každý úder.*"
- tapOn: "Rychleji"
- assertVisible: "Zastavit metronom, 75.*"
- takeScreenshot: 04-metronome
- tapOn: "Zastavit metronom.*"
- tapOn: "Dokončit ✓"
- waitForAnimationToEnd
- tapOn: "Přeskočit"
- tapOn: "Hotovo →"

# 3–5 — three more extra sessions (reading/metronome are never in a 15-min plan)
- runFlow:
    file: subflows/run-exercise.yaml
    env: { NAME: "Plynulé čtení", STEPS: 6, PRACTICE: "yes" }
- runFlow:
    file: subflows/run-exercise.yaml
    env: { NAME: "Metronomická řeč", STEPS: 5, PRACTICE: "yes" }
- runFlow:
    file: subflows/run-exercise.yaml
    env: { NAME: "Plynulé čtení", STEPS: 6, PRACTICE: "yes" }

# 6th extra → weekly limit paywall
- tapOn:
    id: "tab-exercises"
- tapOn: "Metronomická řeč.*"
- assertVisible: "Speasy Premium"
- assertVisible: "Tento týden máš za sebou 5 cvičení navíc.*"
- takeScreenshot: 04-limit-paywall
- scrollUntilVisible:
    element: "Zavřít"
    direction: UP
- tapOn: "Zavřít"

# …but today's plan is always free
- tapOn:
    id: "tab-home"
- assertVisible: "Plán na dnes je vždy zdarma.*"
- tapOn: "Bránicové dýchání.*|Měkký start hlásek.*"
- assertVisible: "Začít"
- assertNotVisible: "Speasy Premium"
