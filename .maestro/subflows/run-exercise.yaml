# Runs one exercise from the Exercises tab: steps → (practice) → finish → skip rating → done.
# Params: NAME (row title), STEPS (number of steps), PRACTICE ("yes" if it has a practice stage)
appId: ${APP_ID}
---
- tapOn:
    id: "tab-exercises"
- tapOn: "${NAME}.*"
- tapOn: "Začít"
- repeat:
    times: ${STEPS - 1}
    commands:
      - tapOn: "Další →"
- runFlow:
    when:
      true: ${PRACTICE == 'yes'}
    commands:
      - tapOn: "Jdu na to →"
- tapOn: "Dokončit ✓"
- waitForAnimationToEnd
- tapOn: "Přeskočit"
- assertVisible: "Výborně!"
- tapOn: "Hotovo →"
