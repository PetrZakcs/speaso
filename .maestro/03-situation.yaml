# Free situation end-to-end; Premium situation leads to the paywall.
appId: ${APP_ID}
---
- runFlow: subflows/fresh-user.yaml
- tapOn:
    id: "tab-exercises"
- scrollUntilVisible:
    element: "Telefonát.*"
    centerElement: true
- tapOn: "Telefonát.*"

- assertVisible: "Objednat se k lékaři"
- tapOn: "Začít"
- repeat:
    times: 3
    commands:
      - tapOn: "Další →"
- tapOn: "Nacvičit věty →"
- assertVisible: "Věta 1/6.*"
- assertVisible: "Nahraj se"
- repeat:
    times: 5
    commands:
      - tapOn: "Další →"
- tapOn: "Výzva →"
- assertVisible: "Tvoje výzva"
- tapOn: "Dokončit ✓"
- tapOn: "Přeskočit"
- assertVisible: "Výborně!"
- tapOn: "Hotovo →"

# Premium situation → paywall
- scrollUntilVisible:
    element: "Pracovní porada.*"
    centerElement: true
- tapOn: "Pracovní porada.*"
- assertVisible: "Speasy Premium"
- assertVisible: "Tahle situace je součástí Premium."
- scrollUntilVisible:
    element: "Obnovit nákupy"
- takeScreenshot: 03-paywall
- scrollUntilVisible:
    element: "Zavřít"
    direction: UP
- tapOn: "Zavřít"
- assertVisible: "Reálné situace"
