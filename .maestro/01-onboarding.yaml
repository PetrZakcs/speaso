# Fresh install → quiz-style onboarding → plan reveal → breathing win →
# offer (continue free) → home with today's plan.
appId: ${APP_ID}
---
- clearState
- runFlow: subflows/open-app.yaml
- extendedWaitUntil:
    visible: "Mluv svým tempem."
    timeout: 90000
- tapOn: "Začít"

- assertVisible: "Jak ti máme říkat?"
- inputText: "Petr"
- assertVisible: "Budeme tě oslovovat: Petře"
- tapOn: "Pokračovat"

- assertVisible: "Kdy se ti mluví nejhůř?"
- tapOn: "Telefonát.*"
- tapOn: "Prezentace.*"
- tapOn: "Pokračovat"

- assertVisible: "Nejsi v tom sám."
- assertVisible: ".*telefonát, prezentace.*"
- tapOn: "Pokračovat"

- assertVisible: "Co by ti nejvíc pomohlo?"
- tapOn: "Víc jistoty.*"
- tapOn: "Pokračovat"

- assertVisible: "Popiš jednu situaci, která tě čeká"
- tapOn:
    id: "onboarding-scenario-title"
- inputText: "Objednat pizzu"
- pressKey: Enter
- tapOn:
    id: "onboarding-scenario-phrase"
- inputText: "Dobry den, chtel bych pizzu"
- pressKey: Enter
- tapOn: "Pokračovat"

- assertVisible: "Pro koho Speasy nastavujeme?"
- tapOn: "Pro sebe.*"
- tapOn: "Pokračovat"

- assertVisible: "Kolik času denně?"
- tapOn: "15 minut.*"
- tapOn: "Sestavit můj plán"
- tapOn:
    text: "Povolit|Allow"
    optional: true

- extendedWaitUntil:
    visible: "Petře, tvůj plán je připravený"
    timeout: 20000
- assertVisible: "Víc jistoty"
- assertVisible: "Telefonát.*|Prezentace.*"
- takeScreenshot: 01-plan-reveal
- tapOn: "Vyzkoušet hned · 40 sekund"

- assertVisible: "Zkus to se mnou"
- extendedWaitUntil:
    visible: "První krok máš za sebou"
    timeout: 60000
- tapOn: "Pokračovat"

- assertVisible: "Odemkni celý plán"
- assertVisible: "Tvůj nácvik „Objednat pizzu“ je připravený.*"
- takeScreenshot: 01-offer
- scrollUntilVisible:
    element: "Pokračovat zdarma"
- tapOn: "Pokračovat zdarma"

- extendedWaitUntil:
    visible: "Tvůj plán na dnes"
    timeout: 15000
- assertVisible: "Dobrý.*,|Dobré ráno,"
- assertVisible: "Petře"
- assertVisible: "0 z 2"

# The onboarding answer became the first own scenario
- tapOn:
    id: "tab-exercises"
- assertVisible: "Objednat pizzu.*"
