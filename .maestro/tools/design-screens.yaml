# Design review: fresh user through the onboarding funnel → main screens.
# Run: maestro test .maestro/tools/design-screens.yaml  (screenshots land in ~/.maestro/tests/<run>/)
appId: host.exp.Exponent
---
- clearState
- runFlow: ../subflows/open-app.yaml
- extendedWaitUntil:
    visible: "Mluv svým tempem."
    timeout: 90000
- takeScreenshot: s01-welcome
- tapOn: "Začít"
- inputText: "Petr"
- tapOn: "Pokračovat"
- tapOn: "Telefonát.*"
- tapOn: "Prezentace.*"
- takeScreenshot: s02-situations
- tapOn: "Pokračovat"
- takeScreenshot: s03-insight
- tapOn: "Pokračovat"
- tapOn: "Víc jistoty.*"
- takeScreenshot: s04-goal
- tapOn: "Pokračovat"
- tapOn: "Pro sebe.*"
- tapOn: "Pokračovat"
- tapOn: "30 minut.*"
- takeScreenshot: s05-routine
- tapOn: "Sestavit můj plán"
- tapOn:
    text: "Povolit|Allow"
    optional: true
- takeScreenshot: s06-building
- extendedWaitUntil:
    visible: ".*tvůj plán je připravený"
    timeout: 20000
- takeScreenshot: s07-plan
- tapOn: "Vyzkoušet hned · 40 sekund"
- takeScreenshot: s08-win
- extendedWaitUntil:
    visible: "První krok máš za sebou"
    timeout: 60000
- takeScreenshot: s09-win-done
- tapOn: "Pokračovat"
- extendedWaitUntil:
    visible: "Odemkni celý plán"
    timeout: 20000
- takeScreenshot: s10-offer
- scrollUntilVisible:
    element: "Pokračovat zdarma"
- takeScreenshot: s11-offer-bottom
- tapOn: "Pokračovat zdarma"
- takeScreenshot: s12-home
