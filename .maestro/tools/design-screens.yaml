# Design review: fresh user → screenshots of the main screens.
# Run: maestro test .maestro/tools/design-screens.yaml  (screenshots land in ~/.maestro/tests/<run>/)
appId: host.exp.Exponent
---
- clearState
- runFlow: ../subflows/open-app.yaml
- extendedWaitUntil:
    visible: "Mluv svým tempem."
    timeout: 90000
- takeScreenshot: s01-welcome
- tapOn: "Začít"
- inputText: "Petr"
- takeScreenshot: s02-name
- tapOn: "Pokračovat"
- tapOn: "Pro sebe.*"
- takeScreenshot: s03-who
- tapOn: "Pokračovat"
- tapOn: "Telefonát.*"
- tapOn: "Prezentace.*"
- takeScreenshot: s04-situations
- tapOn: "Pokračovat"
- tapOn: "30 minut.*"
- takeScreenshot: s05-routine
- tapOn: "Hotovo"
- tapOn:
    text: "Povolit|Allow"
    optional: true
- extendedWaitUntil:
    visible: "Tvůj plán na dnes"
    timeout: 15000
- takeScreenshot: s06-home
# do the first plan item to see a checked row
- tapOn: "Bránicové dýchání.*|Měkký start hlásek.*"
- takeScreenshot: s07-intro
- tapOn: "Začít"
- takeScreenshot: s08-step
- repeat:
    times: 5
    commands:
      - tapOn: "Další →"
- tapOn: "Dokončit ✓"
- waitForAnimationToEnd
- tapOn: "Docela dobře"
- takeScreenshot: s09-rating
- tapOn: "Uložit"
- takeScreenshot: s10-done
- tapOn: "Hotovo →"
- takeScreenshot: s11-home-progress
- tapOn: "Cvičení, .*"
- takeScreenshot: s12-exercises
- tapOn: "Pokrok.*"
- takeScreenshot: s13-progress
- tapOn: "Profil.*"
- takeScreenshot: s14-profile
- tapOn: "Panic"
- waitForAnimationToEnd
- takeScreenshot: s15-panic
